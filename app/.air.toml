# .air.toml
root = "." # raíz del proyecto

tmp_dir = "tmp"

[build]
  cmd = "go build -o tmp/main ./cmd/api"
  bin = "tmp/main"
  full_bin = "false"
  delay = 1000
  log = "build.log"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "ui", "node_modules"]

[log]
  time = true

# Agrega las carpetas a observar explícitamente si necesitas
[include]
  dirs = ["app", "api", "cmd", "internal", "pkg", "config"]
